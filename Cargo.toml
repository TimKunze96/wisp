[package]
name = "wisp"
version = "0.5.2"
edition = "2024"
description = "Voice chat client for TeamSpeak 3 servers"
license = "MIT"
repository = "https://github.com/TimKunze96/wisp"
publish = false

[dependencies]
anyhow = "1"
time = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
audiopus = "0.3.0-rc.0"
base64 = "0.22"
cpal = "0.18"
dirs = "5"
futures = "0.3"
gpui-kit = "=0.7.1"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
nnnoiseless = { version = "0.5", default-features = false }
ogg = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
md-5 = "0.10"
ed25519-dalek = "2"
flate2 = "1"
sha2 = "0.10"
crc32fast = "1"
reqwest = { version = "0.13", default-features = false }
openh264 = "0.9.10"
banshee-client = { git = "https://github.com/TimKunze96/banshee", rev = "c8e2ae71d168f31a3ce3570c2709ff734cbe5671" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "screencast"] }
pipewire = "0.10.1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
raw-window-handle = "0.6.2"
tray-icon = "0.26"
global-hotkey = "0.9"
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_14_0"] }
apple-cf = { version = "0.11", default-features = false, features = ["cg"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.9.10"
wasapi = "0.27.0"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Wisp"
identifier = "at.timkunze.wisp"
description = "Voice chat client for TeamSpeak 3 servers"
authors = ["Tim Kunze"]
publisher = "Tim Kunze"
homepage = "https://github.com/TimKunze96/wisp"
license-file = "LICENSE"
category = "SocialNetworking"
binaries = [{ path = "wisp", main = true }]
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/wisp.icns",
    "assets/icons/wisp.ico",
]
deep-link-protocols = [{ schemes = ["ts3server"] }]

[package.metadata.packager.macos]
# Ad-hoc signature; there is no Developer ID certificate.
signing-identity = "-"
# ScreenCaptureKit
minimum-system-version = "12.3"
info-plist-path = "packaging/macos/Info.plist"

[package.metadata.packager.appimage]
# the system's own, which talks to its PipeWire daemon
excluded-libs = ["libpipewire*"]

[package.metadata.packager.deb]
# libvulkan1 is loaded at runtime, the rest is linked
depends = ["libxcb1", "libxkbcommon0", "libxkbcommon-x11-0", "libasound2", "libpipewire-0.3-0", "libvulkan1"]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/wisp.ico"

# GPUI is far too slow unoptimised
[profile.dev.package."*"]
opt-level = 2
